name: Maison Prive - Diagnosticar Perfumes e Marketplaces
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-new-stores.yml'
      - 'scripts/diagnose_sources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Testar acesso a paginas publicas
        run: python3 scripts/diagnose_sources.py
