name: Maison Prive - Diagnostico de fotos OQ
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-oq.yml'
      - 'scripts/diagnose_oq.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Testar metadados de produto e categoria
        run: PYTHONPATH=. python3 scripts/diagnose_oq.py
