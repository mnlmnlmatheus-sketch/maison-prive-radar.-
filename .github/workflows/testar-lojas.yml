name: Maison Prive - Diagnostico de Lojas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testar-lojas.yml'
      - 'scripts/probe_sources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Testar acesso de fontes publicas
        run: python3 scripts/probe_sources.py
