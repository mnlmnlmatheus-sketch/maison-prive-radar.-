name: Maison Prive - Radar de Precos
# Execução ampliada: lotes de categorias com fotos originais
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maison-prive-radar
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Validar site e scripts
        run: |
          node --check site/app.js
          python3 -m unittest discover -s tests -v
      - name: Verificar precos
        run: python3 monitor.py
      - name: Importar catálogo público OQVestir com fotos originais
        run: python3 oq_listings.py
      - name: Salvar historico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json data/events.json data/catalog.json data/oq-progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Radar: atualizar historico de precos'
            git fetch origin main
            git rebase origin/main
            git push
          fi
