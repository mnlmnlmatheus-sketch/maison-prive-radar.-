name: Maison Prive - Radar de Precos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-precos.yml'
      - 'monitor.py'
      - 'import_awin.py'
      - 'watchlist.json'
      - 'tests/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maison-prive-radar
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Testar extrator
        run: python3 -m unittest discover -s tests -v
      - name: Verificar precos
        run: python3 monitor.py
      - name: Importar feed Awin quando autorizado
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: python3 import_awin.py
      - name: Salvar historico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json data/events.json data/affiliate-catalog.json data/affiliate-events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Radar: atualizar historico de precos'
            git push
          fi
